spring:
  application:
    name: horizon
  docker:
    compose:
      enabled: false
  # Development-only connection to the local PostgreSQL service in server/compose.yaml.
  # Do not use these credentials with a shared or production database.
  datasource:
    url: jdbc:postgresql://localhost:5433/horizon?sslmode=disable&TimeZone=UTC
    username: horizon
    password: horizon
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
server:
  port: 8081
