sonar.projectKey=krishna916_horizon
sonar.organization=krishna916

# Analyze deployable application source only; docs/design mockups and repository tooling
# must not become production New Code or coverage targets.
sonar.sources=server/src/main,client/src
sonar.tests=server/src/test,client/src,client/e2e,client/scripts

sonar.test.inclusions=server/src/test/**/*.java,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/**/*.spec.ts,client/src/**/*.spec.tsx,client/e2e/**/*.spec.ts,client/e2e/**/*.test.ts,client/scripts/**/*.test.mjs
sonar.exclusions=server/src/test/**/*.java,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/**/*.spec.ts,client/src/**/*.spec.tsx,client/e2e/**/*.spec.ts,client/e2e/**/*.test.ts,client/scripts/**/*.test.mjs,client/src/routeTree.gen.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.woff2

sonar.java.binaries=server/target/classes
sonar.java.test.binaries=server/target/test-classes
sonar.coverage.exclusions=client/scripts/assert-coverage.mjs
sonar.coverage.jacoco.xmlReportPaths=server/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
